[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcc-coordinator"
version = "0.1.0"
description = "Voice Coding Coach coordinator backend (Phase 0 foundation)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "websockets==17.4",
  "hypothesis==6.170.15",
  "fsrs==6.3.3",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
  "tree-sitter-java==0.23.5",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend", "backend.app", "backend.app.*"]
exclude = ["backend.tests*", "backend.scripts*", "*.__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
"backend.app.exercises" = ["case_manifest.json"]
"backend.app.repo_learning" = ["golden/*.json"]
"backend.app.studio" = ["scenarios/catalog/*.json"]
"backend.app.db" = ["schema.sql", "migrations/*.sql"]
"backend.app.db.postgres" = ["runtime_schema.sql"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "**/*.pyc", "**/*.pyo"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0,<4.0.0"]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
